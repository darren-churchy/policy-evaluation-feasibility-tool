<!DOCTYPE html>
<html lang="en" class="govuk-template">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#54319f" />
    <meta name="description" content="Decision-support tool for assessing impact evaluation design feasibility." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eval Feasibility" />

    <title>Impact Evaluation Feasibility Tool</title>

    <!-- GOV.UK and MoJ Frontend are compiled locally from npm dependencies into
         src/styles/vendor/govuk-moj.css and imported by src/index.css, so no stylesheet
         is fetched at runtime. Regenerate with `npm run css:vendor`.

         The typeface is the one remaining third-party fetch. It degrades gracefully —
         offline or blocked, the stack falls back to Segoe UI and Arial and the app is
         fully usable. Self-hosting it would remove the last runtime dependency; it is
         left for a follow-up because it needs the font files committed to the repo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- PWA icons -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  </head>
  <body class="govuk-template__body">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
