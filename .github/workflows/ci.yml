name: CI

# Runs on every push and pull request. Deployment is handled by Cloudflare Pages, not
# here — this workflow only gates correctness.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Schema validation runs first: a malformed specification makes every downstream
      # failure harder to read.
      - name: Validate specification
        run: npm run spec:check

      # The spec bundle is what the browser actually runs. If it drifts, a rule change
      # validates and generates a correct reviewer pack while shipping the old behaviour.
      - name: Spec bundle is current
        run: npm run spec:build:check

      # The reviewer pack is committed so that a rule change shows up in review as a
      # change to the sentence a reviewer reads. This fails if it has drifted.
      - name: Reviewer pack is current
        run: npm run pack:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
