<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Purple background -->
  <rect width="512" height="512" rx="88" fill="#54319f"/>
  <!-- Start node (left) -->
  <circle cx="100" cy="256" r="24" fill="#ffffff"/>
  <!-- Horizontal stem: start node to fork junction -->
  <line x1="124" y1="256" x2="212" y2="256" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  <!-- Fork junction dot -->
  <circle cx="212" cy="256" r="18" fill="#ffffff"/>
  <!-- Vertical connector joining the two branch starts -->
  <line x1="212" y1="148" x2="212" y2="364" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  <!-- Upper horizontal branch -->
  <line x1="212" y1="148" x2="402" y2="148" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  <!-- Lower horizontal branch -->
  <line x1="212" y1="364" x2="402" y2="364" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>
  <!-- Upper end node -->
  <circle cx="402" cy="148" r="24" fill="#ffffff"/>
  <!-- Lower end node -->
  <circle cx="402" cy="364" r="24" fill="#ffffff"/>
</svg>
