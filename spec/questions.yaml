# The question bank.
#
# Every question the tools display lives here, so the trees, the Design Finder and the
# full assessment cannot diverge in wording, options or meaning. A question answered once
# is prefilled everywhere.
#
# `intake: true` marks the shared intake asked once of everyone.
# `tier` marks a question that serves one rung; the engine skips it once earlier answers
# have blocked that rung.
# `applies_when` is JSON Logic over the answer store — the question is asked only when it
# evaluates true. Absent means always asked (subject to tier gating).
#
# IMPORTANT: every option value is a deliberate state. There is no implicit default and no
# "unknown" that scores as a middle value — an unanswered question leaves the designs that
# depend on it Unknown. Where not-yet-established is a real answer it appears explicitly
# (e.g. `untested`), and rules treat it as a condition to discharge, not as a pass.

spec_version: 1.2.0

questions:

  # ── Shared intake ──────────────────────────────────────────────────────────

  # A scope gate, not a taxonomy. The earlier version asked the user to sort their
  # question into describe / predict / causal, which asked them to classify before they
  # had the vocabulary to, and wrongly implied that descriptive questions are qualitative
  # and causal ones quantitative. Both are false: the question-typing taxonomies each
  # carry their own categories, and impact evaluation runs through counterfactual and
  # theory-based methods alike. So this asks only whether the question is in scope, and
  # sends anyone unsure to the tool that exists to settle it.
  - id: claim_type
    establishable: ex_ante
    text: >-
      Is your research question a causal one — establishing what effect an intervention or
      policy caused?
    hint: >-
      This tool covers impact evaluation: establishing what effect was caused by an
      intervention or policy. That can be approached with counterfactual designs or with
      theory-based ones, and both are covered here. Questions that are not causal — what is
      happening, who is likely to be affected, how delivery worked — need different methods
      and different standards.
    intake: true
    options:
      - { value: causal, label: 'Yes — establishing what effect an intervention or policy caused' }
      - { value: other,  label: 'No — my question is about something else' }
      - { value: unsure, label: 'Not sure — help me work out what kind of question this is', not_established: true }
    references: [magenta_book]

  - id: intervention_defined
    establishable: ex_ante
    text: Is the intervention clearly defined and documented?
    hint: >-
      What it consists of, who delivers it, and at what intensity. Without this, an observed
      effect cannot be attributed to the intervention rather than to variation in delivery.
    intake: true
    rob_domain: Deviations from intended intervention
    options:
      - { value: 'yes',     label: Yes — specified and documented }
      - { value: partial, label: Partly — being developed }
      - { value: 'no',      label: No }
    references: [magenta_book, robins_i_v2]

  - id: theory_of_change
    establishable: ex_ante
    text: Does a theory of change or logic model exist?
    hint: >-
      A causal model linking the intervention to expected outcomes. Without one it is unclear
      what the evaluation should measure or how to interpret what it finds.
    intake: true
    options:
      - { value: 'yes',     label: Yes — documented }
      - { value: partial, label: Partly — in development }
      - { value: 'no',      label: No }
    references: [magenta_book]

  - id: maturity
    establishable: ex_ante
    text: Is the intervention operating at sufficient scale and maturity?
    hint: >-
      Evaluating impact while delivery is still stabilising risks measuring the immaturity of
      the intervention rather than its effectiveness.
    intake: true
    options:
      - { value: 'yes',     label: Yes — stable and at scale }
      - { value: partial, label: Partly — scaling or still changing }
      - { value: 'no',      label: No — early or small-scale }
    references: [magenta_book]

  # Delivery fidelity. Not a gate: an intervention delivered inconsistently can still be
  # evaluated, but what is being estimated is the effect of a varying bundle rather than of
  # a single thing, and that has to be said rather than discovered afterwards.
  - id: delivery_consistency
    establishable: ex_ante
    text: Is the intervention delivered consistently across sites and practitioners?
    hint: >-
      Where delivery varies, an impact estimate is an average over whatever was actually
      delivered. That can still be the right quantity — but it is a different claim from
      the effect of the intervention as specified.
    intake: true
    options:
      - { value: 'yes',   label: Yes — established and documented }
      - { value: unsure, label: Unsure — not yet established, not_established: true }
      - { value: 'no',    label: 'No' }
    references: [magenta_book]

  # Practical constraint. Deliberately kept OUT of every verdict: the ladder ranks designs
  # by the assumption that makes their comparison valid, and letting a budget or a deadline
  # reorder that is the compensatory trade-off the redesign exists to remove. It shapes
  # where to spend effort, which is advice, not feasibility.
  - id: primary_constraint
    establishable: ex_ante
    text: What is your most significant practical constraint?
    hint: >-
      This never rules a design in or out — a tight deadline does not make a weaker design
      more valid. It is used only to say where the effort identified by the open questions
      is best spent first.
    intake: true
    options:
      - { value: time,   label: Time — a decision is needed quickly }
      - { value: data,   label: Data — limited access or coverage }
      - { value: budget, label: Resources — limited evaluation budget }
      - { value: ethics, label: Ethics — concerns about withholding the intervention }
      - { value: unsure, label: Not yet established, not_established: true }
    references: [magenta_book]

  # Record linkage. Not a note about data quality — a structural constraint that rules
  # designs out more sharply than most methodological considerations do, because an effect
  # is a contrast between outcomes with and without treatment, and estimating one requires
  # observing both on the same units.
  - id: record_linkage
    establishable: ex_ante
    text: Can treatment status and outcomes be brought together for the same units?
    hint: >-
      Whether the records holding who received the intervention and the records holding the
      outcome can be joined — by an identifier, or by belonging to the same area or cohort.
      Governance counts as much as technical feasibility: a linkage that cannot be approved
      is not available.
    intake: true
    options:
      - { value: individual, label: 'Yes — at the level of individual records' }
      - { value: group,      label: 'Only at group or area level — sites, regions, cohorts' }
      - { value: 'no',       label: 'No — they cannot be brought together' }
      - { value: unsure,     label: Not yet established, not_established: true }
    references: [hernan_robins_2020, magenta_book]

  - id: prospective
    establishable: ex_ante
    text: Can the evaluation be planned before the intervention reaches participants?
    hint: >-
      Randomised designs require allocation to be decided in advance. If the intervention has
      already rolled out, only observational designs remain available.
    intake: true
    options:
      - { value: 'yes', label: Yes — the evaluation can be designed in advance }
      - { value: 'no',  label: No — the intervention has already been delivered or allocated }
    references: [magenta_book]

  # ── Tier 1 · Randomised ────────────────────────────────────────────────────

  - id: randomisation_barriers
    establishable: ex_ante
    text: What barriers are there to randomising who receives the intervention?
    hint: >-
      Ethical, legal, political or operational. Many common objections are addressed by a
      design adaptation rather than by abandoning randomisation.
    tier: 1
    rob_domain: Randomisation process
    options:
      - { value: none,       label: None identified }
      - { value: some,       label: 'Some, likely addressable by design adaptation' }
      - { value: high,       label: Significant }
      - { value: impossible, label: Randomisation is ruled out }
    references: [rob2, magenta_book]

  - id: allocation_unit
    establishable: ex_ante
    text: What is the natural unit of allocation?
    hint: >-
      Where the intervention is delivered to whole sites, classes or caseloads, individuals
      within them cannot be allocated separately.
    tier: 1
    options:
      - { value: individual, label: Individual people }
      - { value: cluster,    label: 'Groups — sites, teams, areas or caseloads' }
      - { value: either,     label: Either is possible }
    references: [rob2]

  - id: cluster_count
    establishable: ex_ante
    text: How many clusters could be allocated?
    hint: >-
      For a cluster design, precision is governed by the number of clusters far more than by
      the number of people within them.
    tier: 1
    applies_when:
      in: [{ var: allocation_unit }, [cluster, either]]
    options:
      - { value: many,     label: 40 or more }
      - { value: moderate, label: Roughly 15 to 40 }
      - { value: few,      label: Fewer than 15 }
    references: [rob2]

  - id: rollout_order_controllable
    establishable: ex_ante
    text: Is there a phased rollout whose order you could set?
    hint: >-
      Where everyone is treated eventually but not at once, randomising the order gives a
      stepped-wedge design without withholding the intervention from anyone.
    tier: 1
    options:
      - { value: 'yes',    label: Yes — the order is ours to decide }
      - { value: partly, label: Partly — some influence over sequencing }
      - { value: 'no',     label: No — the order is fixed or externally determined }
    references: [magenta_book]

  - id: delay_acceptable
    establishable: ex_ante
    text: Would delaying the intervention for part of the group be acceptable?
    hint: Everyone receives the intervention; some receive it later, forming a temporary comparison.
    tier: 1
    options:
      - { value: 'yes',     label: Yes — a delay is tolerable }
      - { value: unclear, label: Unclear — needs discussion, not_established: true }
      - { value: 'no',      label: 'No — delay is not acceptable' }
    references: [magenta_book]

  - id: outcome_reversible
    establishable: ex_ante
    text: Does the outcome return to baseline once the intervention stops?
    hint: Required for a crossover design, where participants act as their own control.
    tier: 1
    options:
      - { value: 'yes',     label: Yes — the effect does not persist }
      - { value: unclear, label: Unclear, not_established: true }
      - { value: 'no',      label: 'No — effects persist or accumulate' }
    references: [rob2]

  - id: washout_feasible
    establishable: ex_ante
    text: Can a washout period be built in between conditions?
    hint: A gap long enough for the first condition's effect to dissipate before the second begins.
    tier: 1
    applies_when:
      in: [{ var: outcome_reversible }, ['yes', unclear]]
    options:
      - { value: 'yes',     label: Yes }
      - { value: unclear, label: Unclear, not_established: true }
      - { value: 'no',      label: 'No' }
    references: [rob2]

  - id: encouragement_lever
    establishable: ex_ante
    text: Is there a way to encourage take-up without assigning the intervention itself?
    hint: >-
      An invitation, reminder or incentive offered at random. Useful where the intervention
      cannot be withheld but take-up is voluntary.
    tier: 1
    options:
      - { value: 'yes',     label: Yes — a credible encouragement exists }
      - { value: unclear, label: Possibly — needs exploration, not_established: true }
      - { value: 'no',      label: 'No' }
    references: [angrist_pischke_2009]

  - id: equipoise
    establishable: ex_ante
    text: Is there genuine uncertainty about whether the intervention works?
    hint: >-
      Randomisation is hard to justify where the intervention is already known to be
      effective or known to be harmful.
    tier: 1
    options:
      - { value: 'yes',     label: Yes — the effect is genuinely uncertain }
      - { value: unclear, label: Contested among stakeholders }
      - { value: 'no',      label: 'No — the effect is considered established' }
    references: [magenta_book]

  # ── Tier 2 · Local as-if random ────────────────────────────────────────────

  - id: assignment_threshold
    establishable: ex_ante
    text: Is the intervention assigned by a score, date or threshold?
    hint: >-
      An eligibility cutoff on a continuous measure — a risk score, an age, an income
      boundary. Those just either side of it are comparable.
    tier: 2
    options:
      - { value: 'yes',      label: Yes — a documented cutoff exists }
      - { value: possible, label: Possibly — needs investigation }
      - { value: 'no',       label: 'No' }
    references: [imbens_lemieux_2008]

  - id: threshold_enforced
    establishable: needs_data
    text: How strictly is the cutoff followed in practice?
    hint: >-
      Strict enforcement gives a sharp design. Partial compliance gives a fuzzy design, which
      estimates an effect only for those whose treatment the cutoff actually changed.
    tier: 2
    applies_when:
      in: [{ var: assignment_threshold }, ['yes', possible]]
    options:
      - { value: sharp,   label: Strictly — the cutoff determines treatment }
      - { value: fuzzy,   label: Mostly — the cutoff shifts the probability of treatment }
      - { value: unclear, label: Not yet established, not_established: true }
    references: [imbens_lemieux_2008]

  - id: threshold_manipulation
    establishable: needs_data
    text: Could people position themselves either side of the cutoff?
    hint: >-
      If the score can be influenced by those it affects, the comparison breaks down. A
      density test checks for bunching at the cutoff.
    tier: 2
    applies_when:
      in: [{ var: assignment_threshold }, ['yes', possible]]
    rob_domain: Selection of participants
    options:
      - { value: no_evidence, label: Tested — no evidence of sorting }
      - { value: untested,    label: Not yet tested, not_established: true }
      - { value: suspected,   label: Sorting is likely or demonstrated }
    references: [mccrary_2008]

  - id: density_near_cutoff
    establishable: needs_data
    text: How many observations fall close to the cutoff?
    hint: >-
      Only observations near the cutoff identify the effect. The total sample is not the
      relevant quantity here.
    tier: 2
    applies_when:
      in: [{ var: assignment_threshold }, ['yes', possible]]
    options:
      - { value: many,     label: Many }
      - { value: some,     label: Some }
      - { value: few,      label: Few }
      - { value: unknown,  label: Not yet established, not_established: true }
    references: [cattaneo_etal_2020]

  - id: instrument_available
    establishable: ex_ante
    text: Is there a factor that shifts take-up but has no other route to the outcome?
    hint: >-
      Distance to a service, a lottery, an administrative quirk. Its credibility rests on an
      argument about mechanism, not on a statistical test.
    tier: 2
    options:
      - { value: 'yes',      label: Yes — a candidate instrument exists }
      - { value: possible, label: Possibly — needs investigation }
      - { value: 'no',       label: 'No' }
    references: [angrist_pischke_2009]

  - id: instrument_strength
    establishable: needs_data
    text: How strongly does that factor predict take-up?
    hint: >-
      A weak instrument gives badly behaved estimates. The conventional first-stage F above
      10 is a rule of thumb, and a contested one.
    tier: 2
    applies_when:
      in: [{ var: instrument_available }, ['yes', possible]]
    options:
      - { value: strong,  label: Strongly }
      - { value: weak,    label: Weakly }
      - { value: untested, label: Not yet established, not_established: true }
    references: [lee_etal_2022]

  - id: exclusion_restriction
    establishable: ex_ante
    text: Can you argue the factor affects the outcome only through take-up?
    hint: >-
      This cannot be tested. It is defended on substantive grounds, and it is where most
      instrumental-variable designs fail.
    tier: 2
    applies_when:
      in: [{ var: instrument_available }, ['yes', possible]]
    options:
      - { value: defensible,  label: Yes — a clear substantive argument exists }
      - { value: doubtful,    label: Doubtful — plausible alternative routes exist }
      - { value: unassessed,  label: Not yet considered, not_established: true }
    references: [angrist_pischke_2009]

  # ── Tier 3 · Comparison-group panel ────────────────────────────────────────

  - id: pre_periods
    establishable: ex_ante
    text: How much outcome data do you have from before the intervention?
    hint: >-
      Pre-intervention periods are what make a trend testable rather than assumed. One period
      permits a difference but allows no check on whether the groups were moving together.
    tier: 3
    options:
      - { value: many, label: Several periods }
      - { value: few,  label: Two or three periods }
      - { value: one,  label: One period only }
      - { value: none, label: None }
    references: [angrist_pischke_2009]

  - id: comparison_group
    establishable: ex_ante
    text: Is there a group that did not receive the intervention but is otherwise similar?
    hint: Another region, service, cohort or eligibility group facing comparable conditions.
    tier: 3
    options:
      - { value: 'yes',      label: Yes — a credible comparison exists }
      - { value: possible, label: Possibly — needs investigation }
      - { value: 'no',       label: 'No' }
    references: [whatworks_sms]

  - id: parallel_trends_evidence
    establishable: needs_data
    text: Did the two groups move together before the intervention?
    hint: >-
      The central assumption of a difference-based design. It is examined in the pre-period,
      never proved — the periods after the intervention are exactly what cannot be checked.
    tier: 3
    applies_when:
      in: [{ var: pre_periods }, [many, few]]
    options:
      - { value: supported, label: Yes — examined and consistent }
      - { value: untested,  label: Not yet examined, not_established: true }
      - { value: violated,  label: 'No — the trends clearly diverge' }
    references: [angrist_pischke_2009, goodman_bacon_2021]

  - id: staggered_rollout
    establishable: ex_ante
    text: Did different groups start at different times?
    hint: >-
      Variation in start dates can strengthen a design, but it also makes the conventional
      estimator unreliable, so it changes which estimator is appropriate.
    tier: 3
    options:
      - { value: 'yes',     label: Yes — adoption was staggered }
      - { value: planned, label: Planned but not yet begun }
      - { value: 'no',      label: 'No — a single common start date' }
    references: [goodman_bacon_2021, callaway_santanna_2021]

  - id: donor_pool
    establishable: ex_ante
    text: Are there untreated units that resemble the treated one?
    hint: >-
      A synthetic control builds a comparison by weighting several untreated units. It needs
      enough candidates for the weighted combination to track the treated unit beforehand.
    tier: 3
    applies_when:
      in: [{ var: comparison_group }, ['yes', possible, 'no']]
    options:
      - { value: 'yes',     label: Yes — a reasonable pool exists }
      - { value: limited, label: 'A few, of uncertain comparability' }
      - { value: 'no',      label: 'No comparable units' }
    references: [abadie_2021]

  - id: control_series
    establishable: ex_ante
    text: Is there an equivalent time series for an unaffected group?
    hint: >-
      A control series distinguishes a change caused by the intervention from one that was
      happening anyway.
    tier: 3
    options:
      - { value: 'yes',     label: Yes }
      - { value: unclear, label: Possibly — needs investigation, not_established: true }
      - { value: 'no',      label: 'No' }
    references: [bernal_etal_2017]

  - id: policy_date_known
    establishable: ex_ante
    text: Is the date the intervention took effect precisely known?
    hint: Required where the comparison is between the periods either side of a change.
    tier: 3
    options:
      - { value: 'yes',         label: Yes — a specific date }
      - { value: approximate, label: Approximately — phased or uncertain }
      - { value: 'no',          label: 'No' }
    references: [bernal_etal_2017]

  - id: cointerventions
    establishable: ex_ante
    text: Did anything else change at the same time?
    hint: >-
      Other policies, funding changes or external shocks coinciding with the intervention
      cannot be separated from it in a time-series comparison.
    tier: 3
    rob_domain: Confounding
    options:
      - { value: none_known, label: Nothing else identified }
      - { value: possible,   label: Possibly — not yet checked }
      - { value: known,      label: 'Yes — other changes coincided' }
    references: [bernal_etal_2017, robins_i_v2]

  # ── Tier 4 · Selection on observables ──────────────────────────────────────

  - id: covariate_richness
    establishable: ex_ante
    text: How much do you know about the characteristics of both groups?
    hint: >-
      Adjustment can only account for what is measured. The question is whether you hold the
      variables that drove who received the intervention.
    tier: 4
    rob_domain: Confounding
    options:
      - { value: rich,    label: 'Extensive, for treated and untreated alike' }
      - { value: partial, label: 'Some, with known gaps' }
      - { value: sparse,  label: Little }
    references: [stuart_2010, robins_i_v2]

  - id: overlap
    establishable: needs_data
    text: Do treated and untreated units actually resemble each other?
    hint: >-
      Where no untreated unit resembles a treated one, no comparison exists for it. This is
      positivity, and it is checked rather than assumed.
    tier: 4
    applies_when:
      in: [{ var: covariate_richness }, [rich, partial]]
    options:
      - { value: good,     label: Good — the groups overlap substantially }
      - { value: limited,  label: Limited — overlap only in part of the range }
      - { value: poor,     label: Poor — the groups barely overlap }
      - { value: untested, label: Not yet examined, not_established: true }
    references: [li_etal_2018, austin_2011]

  - id: confounders_measured
    establishable: ex_ante
    text: Are the main reasons people received the intervention captured in your data?
    hint: >-
      List the drivers of selection, then check which you actually hold. What is left over is
      what adjustment cannot fix.
    tier: 4
    rob_domain: Confounding
    options:
      - { value: all_identified,  label: The main drivers are measured }
      - { value: some_unmeasured, label: Some known drivers are not measured }
      - { value: unknown,         label: Not yet established, not_established: true }
    references: [vanderweele_ding_2017, hernan_robins_2020]

  - id: time_varying_confounding
    establishable: ex_ante
    text: Does treatment at one point change the factors that drive later treatment?
    hint: >-
      Common in ongoing services, where a response to the intervention affects whether it
      continues. Conventional adjustment is biased here, in either direction.
    tier: 4
    options:
      - { value: 'yes',     label: Yes — treatment and confounders evolve together }
      - { value: unclear, label: Unclear, not_established: true }
      - { value: 'no',      label: 'No — treatment is a one-off' }
    references: [robins_etal_2000, hernan_robins_2020]

  - id: repeated_measures
    establishable: ex_ante
    text: Do you hold repeated measures of treatment and of the confounders over time?
    hint: Required to model the feedback between treatment and the factors that affect it.
    tier: 4
    applies_when:
      in: [{ var: time_varying_confounding }, ['yes', unclear]]
    options:
      - { value: 'yes', label: Yes — at several time points }
      - { value: 'no',  label: 'No' }
    references: [robins_etal_2000]

  # ── Tier 5 · Single time series ────────────────────────────────────────────

  - id: time_points
    establishable: ex_ante
    text: How many time points do you have before and after the intervention?
    hint: >-
      A trend has to be estimated on each side of the interruption. Roughly eight points per
      segment is a common minimum, and a convention rather than a derived figure.
    tier: 5
    options:
      - { value: many,     label: Eight or more each side }
      - { value: moderate, label: Roughly four to eight each side }
      - { value: few,      label: Fewer than four each side }
    references: [wagner_etal_2002, bernal_etal_2017]

  - id: autocorrelation_plan
    establishable: ex_ante
    text: Is there a plan to account for correlation between adjacent time points?
    hint: >-
      Observations close in time resemble each other. Ignoring this makes the effect look
      more precisely estimated than it is.
    tier: 5
    options:
      - { value: 'yes',     label: Yes — it will be modelled }
      - { value: unclear, label: Not yet decided, not_established: true }
      - { value: 'no',      label: 'No' }
    references: [bernal_etal_2017]

  # ── Theory-based strand ────────────────────────────────────────────────────

  - id: stakeholder_access
    establishable: ex_ante
    text: Can you speak to the people who deliver and receive the intervention?
    hint: Required to elicit how the intervention is meant to work, and for whom.
    options:
      - { value: 'yes',     label: Yes }
      - { value: limited, label: Limited }
      - { value: 'no',      label: 'No' }
    references: [pawson_tilley_1997]

  - id: documentary_evidence
    establishable: ex_ante
    text: Is there documentation covering each step of the intended causal chain?
    hint: Records, monitoring data, case files or correspondence evidencing what happened at each stage.
    options:
      - { value: 'yes',     label: Yes — substantial }
      - { value: limited, label: Patchy }
      - { value: 'no',      label: 'No' }
    references: [beach_pedersen_2019]

  # ── Statistics module · shared ─────────────────────────────────────────────
  #
  # Asked of everyone before the approach-specific sets. The approach question comes
  # first because sample size does a different job under each, so the questions that
  # follow are not translations of one another.

  - id: analysis_approach
    establishable: ex_ante
    text: What is your primary intended analytical approach?
    hint: >-
      This decides which set of questions follows. Sample size serves a different purpose
      under each: controlling error rates, or achieving precision for a decision.
    options:
      - { value: nhst,      label: 'Frequentist — significance testing and confidence intervals' }
      - { value: bayesian,  label: 'Bayesian — posterior distributions and credible intervals' }
      - { value: both,      label: 'Both — a frequentist primary analysis with Bayesian support, or the reverse' }
      - { value: undecided, label: Not yet decided }
    references: [magenta_book]

  - id: outcome_type
    establishable: ex_ante
    text: What kind of outcome are you measuring?
    hint: The outcome type governs which sizing formula applies and what varies.
    options:
      - { value: continuous,     label: 'Continuous — a score, cost or duration' }
      - { value: binary,         label: 'Binary — whether something happened' }
      - { value: count,          label: 'Count — how many times something happened' }
      - { value: time_to_event,  label: 'Time to event — how long until something happened' }
    references: [rob2]

  - id: outcome_clustered
    establishable: ex_ante
    text: Are outcomes grouped within sites, practitioners or caseloads?
    hint: >-
      Outcomes for people sharing a site resemble each other, so they carry less
      information than the same number of unrelated observations.
    options:
      - { value: 'yes',     label: Yes }
      - { value: unclear, label: Possibly — not yet established, not_established: true }
      - { value: 'no',      label: 'No' }
    references: [rob2]

  - id: expected_attrition
    establishable: ex_ante
    text: How much loss to follow-up do you expect?
    hint: >-
      Attrition reduces the usable sample and, where it differs between groups, threatens
      the comparison itself rather than only its precision.
    rob_domain: Missing outcome data
    options:
      - { value: low,      label: 'Low — under 10%' }
      - { value: moderate, label: 'Moderate — 10% to 25%' }
      - { value: high,     label: 'High — over 25%' }
      - { value: unknown,  label: Not yet established, not_established: true }
    references: [rob2]

  # Distinct from expected_attrition. Attrition is a unit leaving the study; missingness is
  # a record that exists with the outcome field empty. Both reduce what can be analysed,
  # they arise for different reasons, and they are handled differently — so they are asked
  # separately rather than merged into one "data loss" question.
  - id: outcome_missingness
    establishable: ex_ante
    text: How much missing data do you expect in the primary outcome?
    hint: >-
      Missingness in the measure itself, as distinct from loss to follow-up. Where the
      outcome comes from administrative data, the source's known completeness is the place
      to start.
    options:
      - { value: low,      label: 'Low — under 5%' }
      - { value: moderate, label: 'Moderate — 5% to 20%' }
      - { value: high,     label: 'High — over 20%' }
      - { value: unknown,  label: Not yet established, not_established: true }
    references: [rob2, robins_i_v2]

  - id: sample_fixed
    establishable: ex_ante
    text: Is the number of units fixed by context, or can you choose it?
    hint: >-
      This reverses the question. Where the sample can be chosen, you size it to a target.
      Where it is fixed, you ask what that sample can and cannot establish.
    options:
      - { value: choosable, label: 'It can be chosen — recruitment or rollout is still open' }
      - { value: fixed,     label: 'It is fixed — the caseload or cohort is what it is' }
    references: [ohagan_etal_2005]

  # ── Statistics module · frequentist ────────────────────────────────────────

  - id: nhst_mde
    establishable: ex_ante
    text: What is the smallest effect that would be worth detecting?
    hint: >-
      Not the effect you hope for — the smallest one that would still change a decision.
      Sizing on an optimistic effect is the most common way studies end up underpowered.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: agreed,     label: Agreed and documented }
      - { value: informal,   label: 'Discussed, not settled' }
      - { value: not_set,    label: Not yet considered, not_established: true }
    references: [rob2]

  - id: nhst_mde_source
    establishable: ex_ante
    text: Who set that figure, and on what basis?
    hint: >-
      A minimum detectable effect set by the analyst to make the sample work is a
      circular justification. It should come from the decision or from prior evidence.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: decision,   label: 'From the decision — the effect that changes what we would do' }
      - { value: evidence,   label: From prior evidence on similar interventions }
      - { value: convention, label: 'From a convention — a standardised effect size benchmark' }
      - { value: unstated,   label: Not established, not_established: true }
    references: [rob2, magenta_book]

  - id: nhst_baseline_source
    establishable: ex_ante
    text: Where do your baseline rate and variability estimates come from?
    hint: >-
      Every sizing calculation rests on these. An estimate from a different population or
      period can be badly wrong in either direction.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: local,    label: 'From this population, recently' }
      - { value: similar,  label: From a comparable population or an earlier period }
      - { value: literature, label: From published literature on other settings }
      - { value: assumed,  label: 'Assumed, with no source' }
    references: [rob2]

  - id: nhst_alpha_power
    establishable: ex_ante
    text: Have the significance level and target power been agreed?
    hint: >-
      Conventionally 5% and 80% or 90%. Both are conventions rather than derived figures,
      and worth stating rather than inheriting.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: agreed,   label: 'Yes — agreed and recorded' }
      - { value: default,  label: Using conventional defaults without discussion }
      - { value: not_set,  label: Not yet decided, not_established: true }
    references: [rob2]

  - id: nhst_multiplicity
    establishable: ex_ante
    text: How many outcomes will be tested, and is there a plan for multiplicity?
    hint: >-
      Testing many outcomes without a plan inflates the chance of a spurious positive, and
      is the usual route to a finding that does not replicate.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    rob_domain: Selection of the reported result
    options:
      - { value: single,     label: 'One primary outcome, designated in advance' }
      - { value: planned,    label: Several outcomes with a stated adjustment or hierarchy }
      - { value: unplanned,  label: Several outcomes with no plan }
    references: [rob2]

  - id: nhst_icc
    establishable: ex_ante
    text: Do you have an intracluster correlation estimate?
    hint: >-
      Required to size a clustered design. The result is sensitive to the value assumed, so
      a range matters more than a point estimate.
    applies_when:
      and:
        - { in: [{ var: analysis_approach }, [nhst, both]] }
        - { in: [{ var: outcome_clustered }, ['yes', unclear]] }
    options:
      - { value: local,     label: From comparable data }
      - { value: published, label: From published estimates in this field }
      - { value: assumed,   label: Assumed without a source }
      - { value: none,      label: Not yet obtained }
    references: [rob2]

  - id: nhst_attrition_modelled
    establishable: ex_ante
    text: Has expected attrition been built into the sizing?
    hint: Sizing on the recruited sample rather than the analysed sample overstates precision.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: 'yes',       label: 'Yes — with scenarios for different rates' }
      - { value: single,    label: 'Yes, at a single assumed rate' }
      - { value: 'no',        label: 'Not yet' }
    references: [rob2]

  - id: nhst_sequential
    establishable: ex_ante
    text: Will there be interim analyses?
    hint: >-
      Looking at the data repeatedly and stopping when significant inflates the error rate
      unless the analysis plan accounts for it.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: none,       label: 'No — a single analysis at the end' }
      - { value: planned,    label: 'Yes, with a pre-specified spending function' }
      - { value: unplanned,  label: 'Yes, with no stated adjustment' }
    references: [rob2]

  - id: nhst_sensitivity
    establishable: ex_ante
    text: Will the sizing be reported across a range of assumptions?
    hint: >-
      Variance, baseline rate and intracluster correlation are all estimates. A single
      number implies more certainty about the design than exists.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    options:
      - { value: 'yes',      label: 'Yes — a range for each key input' }
      - { value: 'no',       label: 'No — a single calculation' }
      - { value: unclear,  label: Not yet decided, not_established: true }
    references: [rob2]

  - id: nhst_preregistration
    establishable: ex_ante
    text: Will the analysis be pre-registered or otherwise recorded before data are seen?
    hint: >-
      The protection against analytic choices being made, knowingly or not, to favour a
      result.
    applies_when:
      in: [{ var: analysis_approach }, [nhst, both]]
    rob_domain: Selection of the reported result
    options:
      - { value: 'yes',      label: 'Yes — registered or lodged in advance' }
      - { value: internal, label: Documented internally but not registered }
      - { value: 'no',       label: 'No' }
    references: [rob2]

  # ── Statistics module · Bayesian ───────────────────────────────────────────
  #
  # See docs/BAYESIAN_SAMPLE_SIZE.md. These are not translations of the frequentist set:
  # a small sample does not invalidate a Bayesian inference, it makes the prior
  # load-bearing, so the questions are built to make the prior's contribution explicit.

  - id: bayes_decision_threshold
    establishable: ex_ante
    text: What size of effect would change the decision?
    hint: >-
      The analysis can then report the probability that the effect exceeds it — which is
      the question a decision-maker actually asked, and one a significance test cannot
      answer.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: agreed,   label: Agreed with those making the decision }
      - { value: proposed, label: 'Proposed, not yet agreed' }
      - { value: not_set,  label: Not yet considered, not_established: true }
    references: [kruschke_2018, opre_bayesian_social_policy]

  - id: bayes_rope
    establishable: ex_ante
    text: Is there a range of effects you would treat as equivalent to no effect?
    hint: >-
      A region of practical equivalence lets the analysis conclude that an effect is
      negligible, rather than only failing to find one. Its bounds are a judgement about
      what the decision treats as too small to matter, not a statistical quantity.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: agreed,     label: 'Yes — bounds set by those making the decision' }
      - { value: default,    label: Using a conventional default band }
      - { value: not_set,    label: Not yet considered, not_established: true }
    references: [kruschke_2018]

  - id: bayes_prior_source
    establishable: ex_ante
    text: Where does your prior come from?
    hint: >-
      The most consequential question at small sample sizes, because the prior supplies
      what the data cannot.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: evaluations, label: From previous evaluations of similar interventions }
      - { value: elicited,    label: From structured expert elicitation }
      - { value: weak,        label: 'A weakly informative default, chosen to contribute little' }
      - { value: unstated,    label: Not yet established, not_established: true }
    references: [gosling_2018_shelf, wilson_etal_2021_pilot]

  - id: bayes_elicitation_protocol
    establishable: ex_ante
    text: By what protocol were the expert judgements elicited?
    hint: >-
      A named protocol makes the prior auditable. SHELF trains experts first, takes
      individual judgements before discussion to limit anchoring, then fits a consensus
      distribution.
    applies_when:
      and:
        - { in: [{ var: analysis_approach }, [bayesian, both]] }
        - { '==': [{ var: bayes_prior_source }, elicited] }
    options:
      - { value: shelf,     label: 'SHELF — the Sheffield Elicitation Framework' }
      - { value: classical, label: 'Cooke''s Classical Method, with calibration questions' }
      - { value: other,     label: Another documented protocol }
      - { value: informal,  label: 'Informal discussion, no protocol' }
    references: [gosling_2018_shelf]

  - id: bayes_prior_share
    establishable: ex_ante
    text: How much of the posterior will come from the prior rather than the data?
    hint: >-
      At small sample sizes this can be most of it. That is not disqualifying, but it has
      to be known and reported — otherwise the finding restates the assumption.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: quantified, label: 'Will be quantified and reported' }
      - { value: expected_small, label: 'Expected to be small, not yet checked' }
      - { value: unknown,    label: Not yet considered, not_established: true }
    references: [wilson_etal_2021_pilot, nichd_strong_prior_2019]

  - id: bayes_sensitivity
    establishable: ex_ante
    text: Is a prior sensitivity analysis planned?
    hint: >-
      Re-running under alternative priors, including a sceptical one. The standard
      reviewer challenge, and a stated regulatory expectation.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: planned,  label: 'Yes — with alternatives specified in advance' }
      - { value: intended, label: 'Intended, alternatives not yet chosen' }
      - { value: 'no',       label: 'No' }
    references: [fda_bayesian_2026, nichd_strong_prior_2019]

  - id: bayes_prior_data_conflict
    establishable: ex_ante
    text: What will you do if the prior and the data disagree?
    hint: >-
      Foreseeable, and better decided before the data arrive than after. Discovering the
      conflict and then choosing a response is how a prior becomes unfalsifiable.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: planned,   label: 'A stated plan, agreed in advance' }
      - { value: 'no',        label: Not yet considered }
    references: [fda_bayesian_2026]

  - id: bayes_target
    establishable: ex_ante
    text: What target will size the study, or characterise it if the sample is fixed?
    hint: >-
      Where the sample can be chosen: a target assurance, or a target credible interval
      width. Where it is fixed: the precision the sample can be expected to deliver.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: assurance,    label: 'Assurance — the probability the study gives a usable answer' }
      - { value: precision,    label: 'Precision — a target credible interval width' }
      - { value: utility,      label: 'Expected utility or value of information' }
      - { value: not_set,      label: Not yet chosen, not_established: true }
    references: [ohagan_etal_2005, wilson_etal_2022_ssd]

  - id: bayes_audience_calibration
    establishable: ex_ante
    text: Will the audience expect frequentist error-rate guarantees?
    hint: >-
      Common where findings go to a board or an external reviewer accustomed to p-values.
      Operating characteristics can be simulated, but that has to be planned.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: 'no',         label: 'No — a probabilistic answer will be accepted' }
      - { value: simulated,  label: 'Yes, and operating characteristics will be simulated' }
      - { value: unplanned,  label: 'Yes, with no simulation planned' }
      - { value: unknown,    label: Not yet established, not_established: true }
    references: [fda_bayesian_2026, bayesian_ssd_review_2025]

  - id: bayes_adaptive_stopping
    establishable: ex_ante
    text: Will the design adapt or stop early based on accumulating data?
    hint: >-
      Adaptive stopping is a genuine advantage of the Bayesian approach, and its
      behaviour has to be simulated rather than assumed.
    applies_when:
      in: [{ var: analysis_approach }, [bayesian, both]]
    options:
      - { value: none,       label: 'No — a single analysis at the end' }
      - { value: simulated,  label: 'Yes, with simulated operating characteristics' }
      - { value: unplanned,  label: 'Yes, without simulation' }
    references: [bayesian_adaptive_social_policy, bayesian_ssd_review_2025]
