# Stage vocabulary, readiness gates and tool routing.
#
# This file holds the single stage rule for the whole app. The Causal Readiness page, the
# Design Finder and both decision trees all call the engine's stage inference, which reads
# only what is below. The previous tool implemented stage logic in three places and they
# disagreed: the quantitative tree tagged RCT, DiD, RD, ITS and IV as Grow-stage only,
# while the Design Finder and the Causal Readiness page said impact evaluation suits both
# Test and Grow. That contradiction is resolved here, once.
#
# The resolution follows the Test and Learn annex: impact evaluation designs are available
# at BOTH Test and Grow. What differs between the two is the estimand and the decision the
# evidence informs — at Test, the effect of a specific component or mechanism, informing
# whether to keep refining; at Grow, the effect of a stable intervention at full scale,
# informing whether to continue or expand. The identification requirements are the same at
# both. A design is therefore never restricted to Grow.
#
# Stage labels are published Magenta Book vocabulary and are kept as references. Each
# carries a gloss so the label does not require prior familiarity to read.

spec_version: 1.2.0

stages:
  - id: explore
    label: Explore
    gloss: >-
      Understanding the problem and who it affects, before an intervention has been
      designed.
    citations: [magenta_book]

  - id: co_design
    label: Co-design
    gloss: >-
      Developing the intervention with the people who will deliver and receive it, and
      setting out how it is meant to work.
    citations: [magenta_book]

  - id: test
    label: Test
    gloss: >-
      Trying specific components or mechanisms to find out what works, while the
      intervention is still being refined.
    citations: [magenta_book]

  - id: grow
    label: Grow
    gloss: >-
      Evaluating a stable, fully specified intervention operating at scale.
    citations: [magenta_book]

# ── Readiness ────────────────────────────────────────────────────────────────
#
# Two hard gates and one warning. A gate means impact evaluation cannot answer the
# question yet, whatever the data situation — so it fires before any design is considered.
# Maturity is deliberately NOT a gate: a partly-scaled intervention can still support a
# Test-stage evaluation of a component, which is what the redirect says.

readiness:
  - id: intervention_specified
    question: intervention_defined
    severity: gate
    fires_when:
      '==': [{ var: intervention_defined }, 'no']
    message: >-
      The intervention is not yet specified, so an observed change could not be attributed
      to it rather than to variation in what was delivered. No impact evaluation design
      resolves this.
    redirect: >-
      Document what the intervention consists of, who delivers it and at what intensity. A
      process evaluation can describe and standardise delivery first.
    citations: [magenta_book, robins_i_v2]

  - id: theory_articulated
    question: theory_of_change
    severity: gate
    fires_when:
      '==': [{ var: theory_of_change }, 'no']
    message: >-
      With no theory of change there is nothing to say which outcomes should move, over what
      period, or how a result should be read. The evaluation would have no stated
      expectation to test.
    redirect: >-
      Develop a logic model with delivery staff and stakeholders. A developmental evaluation
      can support this while the intervention is still forming.
    citations: [magenta_book, mayne_2001]

  - id: sufficient_maturity
    question: maturity
    severity: warning
    fires_when:
      '==': [{ var: maturity }, 'no']
    message: >-
      The intervention is early or small-scale, so an evaluation now would largely measure
      its immaturity rather than its effect.
    redirect: >-
      Consider a process or developmental evaluation while delivery stabilises. Where a
      specific component is already settled, a Test-stage evaluation of that component may
      still be worthwhile.
    citations: [magenta_book]

  - id: delivery_consistent
    question: delivery_consistency
    severity: warning
    fires_when:
      '==': [{ var: delivery_consistency }, 'no']
    message: >-
      Delivery varies across sites or practitioners, so an impact estimate would be an
      average over what was actually delivered rather than the effect of the intervention
      as specified.
    redirect: >-
      Evaluation is still possible — say in the protocol that the estimand is the effect of
      the intervention as delivered, and consider a process evaluation alongside it to
      describe the variation. Where the variation is itself the question, a Test-stage
      evaluation of a settled component may be the better design.
    citations: [magenta_book]

  - id: delivery_consistency_unchecked
    question: delivery_consistency
    severity: warning
    fires_when:
      '==': [{ var: delivery_consistency }, unsure]
    message: >-
      Whether delivery is consistent has not been established, so what an impact estimate
      would be an average over is not yet known.
    redirect: >-
      Check delivery records, or speak to the people delivering the intervention, before
      settling the estimand. This can be established now — it does not need the outcome
      data.
    citations: [magenta_book]

# ── Stage inference ──────────────────────────────────────────────────────────
#
# Ordered; the first matching rule wins. The two gates are checked before maturity, since
# a missing specification or theory of change is the more fundamental problem.

inference:
  - when:
      '==': [{ var: intervention_defined }, 'no']
    stages: [co_design]
    note: >-
      The work needed is specifying the intervention, which is Co-design activity.
    citations: [magenta_book]

  - when:
      '==': [{ var: theory_of_change }, 'no']
    stages: [co_design]
    note: >-
      Articulating how the intervention is meant to work is Co-design activity.
    citations: [magenta_book]

  - when:
      '==': [{ var: maturity }, 'no']
    stages: [explore]
    note: >-
      Where the intervention is early and small, the useful work is understanding the
      problem and the delivery context rather than estimating an effect.
    citations: [magenta_book]

  - when:
      or:
        - { '==': [{ var: intervention_defined }, partial] }
        - { '==': [{ var: theory_of_change }, partial] }
        - { '==': [{ var: maturity }, partial] }
    stages: [test]
    note: >-
      Something is still settling, so the appropriate estimand is the effect of a specific
      component or mechanism rather than of the whole programme. Every impact evaluation
      design remains available; what narrows is the claim being made.
    citations: [magenta_book]

  - when:
      and:
        - { '==': [{ var: intervention_defined }, 'yes'] }
        - { '==': [{ var: theory_of_change }, 'yes'] }
        - { '==': [{ var: maturity }, 'yes'] }
    stages: [test, grow]
    note: >-
      Defined, theorised and at scale. Both stages apply: the distinction is whether the
      programme model is still being refined (Test) or is stable and being evaluated at full
      scale (Grow). Identification requirements are identical, so no design is excluded by
      the choice between them.
    citations: [magenta_book]

# ── Tool routing ─────────────────────────────────────────────────────────────
#
# Where a user should go next, and why. Answers already given travel with them, so a
# question answered in one tool is never asked again in another.

routing:
  # The scope gate. `claim_type` decides whether the tool applies at all — it is not a
  # classification of the question, which is what the question-typing tool is for.
  - from: landing
    to: assessment
    when:
      '==': [{ var: claim_type }, causal]
    note: >-
      Causal questions are what this tool assesses. The assessment opens with a short
      screen that rules designs in and out before asking anything design-specific.
    citations: [magenta_book]

  - from: landing
    to: question_typing
    when:
      '==': [{ var: claim_type }, unsure]
    note: >-
      Where it is not yet settled whether the question is causal, the question-typing tool
      establishes that first. It covers quantitative question types — description,
      prediction, causal inference — and qualitative ones separately, because the two are
      not alternatives to each other.
    citations: [magenta_book]

  - from: landing
    to: question_typing
    when:
      '==': [{ var: claim_type }, other]
    note: >-
      A question that is not causal is outside what this tool assesses. The question-typing
      tool points to the methods that do address it, rather than leaving the user at a dead
      end.
    citations: [magenta_book]

  - from: question_typing
    to: assessment
    when:
      '==': [{ var: claim_type }, causal]
    note: >-
      Where the question turns out to be causal after all, the assessment applies and every
      answer already given carries over.

  - from: screening
    to: full_assessment
    note: >-
      Continuing past the screen keeps every answer already given and asks only what the
      remaining rungs require. The screen is a stopping point, not a separate assessment.

  - from: readiness_gate
    to: theory_based_strand
    note: >-
      Where a readiness gate fires, the useful next step is process, developmental or
      contribution work — not a counterfactual design. Impact evaluation is not only
      counterfactual, so this is a redirect within the field rather than out of it.
    citations: [magenta_book, mayne_2001]

# ── Guidance ─────────────────────────────────────────────────────────────────
#
# Advisory only, and structurally unable to be anything else: the engine returns this
# alongside the verdicts and never reads it when reaching one. A practical constraint
# shapes where to spend effort; it must never shape what counts as a valid comparison,
# which is the compensatory trade-off the ladder replaced.
#
# A test asserts that every design verdict, the ladder and the recommendation are identical
# whatever is answered here.

guidance:
  - question: primary_constraint
    when: time
    note: >-
      Where the deadline binds, the question that usually decides everything is whether
      outcome data from before the intervention already exists — collecting it is what
      takes the time, not the analysis. Settle that before narrowing the design.

  - question: primary_constraint
    when: data
    note: >-
      Establish what can actually be obtained and linked before narrowing the design. The
      higher rungs are more often ruled out by data access and linkage than by anything
      methodological, and that is worth finding out early rather than after a design has
      been committed to.

  - question: primary_constraint
    when: budget
    note: >-
      Cost sits in primary data collection and length of follow-up, not in the estimator —
      a design on the higher rungs is rarely more expensive to analyse. Designs reusing
      existing administrative data cost least, so establishing what is already collected is
      where the saving is.

  - question: primary_constraint
    when: ethics
    note: >-
      Where the concern is withholding the intervention, designs in which everyone
      eventually receives it — phased rollout, waitlist, encouragement rather than
      assignment — keep randomisation available without denying anyone treatment. The prior
      question is equipoise: if the intervention is already known to work, randomising is
      the harder thing to justify, and if it is not, withholding is not withholding a known
      benefit.

  - question: primary_constraint
    when: unsure
    note: >-
      Worth settling, because it decides where the effort identified by the open questions
      is best spent first. It never changes which designs are valid.
